{% extends 'users/base.html' %}

{% block title %}Подтверждение кода{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h2 class="fw-bold">Подтверждение</h2>
    <p class="text-muted">Мы отправили код на номер: <span id="display-phone" class="fw-bold"></span></p>
</div>

<div class="form-floating mb-3">
    <input type="text" class="form-control" id="sms_code" placeholder="0000" maxlength="4" inputmode="numeric">
    <label for="sms_code">4-значный код из СМС</label>
    <div id="error-message" class="invalid-feedback d-block mt-2"></div>
</div>

<button type="button" id="verify-btn" class="btn btn-success btn-lg w-100 shadow-sm">
    Войти
</button>
<div class="text-center mt-3">
    <a href="{% url 'users:request_sms_template' %}" class="small text-decoration-none">Изменить номер телефона</a>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 1. При загрузке страницы достаем телефон из памяти
    const phone = localStorage.getItem('user_phone');
    
    if (!phone) {
        // Если телефона нет в памяти, возвращаем на первый шаг
        window.location.href = "{% url 'users:request_sms_template' %}";
    } else {
        document.getElementById('display-phone').innerText = phone;
    }

    document.getElementById('verify-btn').addEventListener('click', async function() {
        const code = document.getElementById('sms_code').value;
        const errorDiv = document.getElementById('error-message');
        const btn = this;

        errorDiv.innerText = '';
        btn.disabled = true;

        try {
            // 2. Отправляем запрос на ваш эндпоинт /login/
            const response = await fetch('/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                // Склеиваем номер и код
                body: JSON.stringify({ 
                    phone_number: phone, 
                    sms_code: code 
                })
            });

            const data = await response.json();

            if (response.ok) {
                // 3. Сохраняем JWT-токены для будущих запросов к профилю
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                
                // 4. Переходим в профиль
                window.location.href = '/template_user_profile';
            } else {
                // Выводим ошибку (например, "Неверный код")
                errorDiv.innerText = data.error || data.sms_code || 'Ошибка верификации';
            }
        } catch (error) {
            errorDiv.innerText = 'Ошибка соединения с сервером';
        } finally {
            btn.disabled = false;
        }
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
